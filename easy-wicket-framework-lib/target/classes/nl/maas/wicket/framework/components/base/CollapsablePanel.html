<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<head>
    <meta charset="UTF-8">
    <title>Modal Panel</title>
</head>
<body>
<wicket:panel>
    <div class="accordion" id="accordion">
        <div class="accordion-item border-0">
            <button class="btn" wicket:id="button" type="button">
                <div>
                    <span wicket:id="buttonLabel">Transfers</span>
                </div>
            </button>

            <div wicket:id="panelToHide" class="accordion-collapse collapse p-1">
                <wicket:container wicket:id="content"/>
            </div>
        </div>
    </div>
</wicket:panel>
</body>
</html>
